map $http_upgrade $relay_connection_upgrade {
    default upgrade;
    '' '';
}

server {
    listen 127.0.0.1:18443 ssl proxy_protocol default_server;
    server_name @PUBLIC_IP@;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    ssl_certificate /var/lib/relay-acme/certificates/@PUBLIC_IP@.crt;
    ssl_certificate_key /var/lib/relay-acme/certificates/@PUBLIC_IP@.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log off;
    client_max_body_size 128m;
    gzip off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $relay_connection_upgrade;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location = /healthz {
        proxy_pass http://127.0.0.1:@RELAY_PORT@/healthz;
    }

    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:@RELAY_PORT@/v1/;
    }

    location ^~ /v1beta/ {
        proxy_pass http://127.0.0.1:@RELAY_PORT@/v1beta/;
    }

    location ^~ /openai/v1/ {
        proxy_pass http://127.0.0.1:@RELAY_PORT@/openai/v1/;
    }

    location ^~ /backend-api/codex/ {
        proxy_pass http://127.0.0.1:@RELAY_PORT@/backend-api/codex/;
    }

    location / {
        return 404;
    }
}
