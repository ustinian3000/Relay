stream {
    map $ssl_preread_alpn_protocols $relay_tls_backend {
        ~(^|,)acme-tls/1(,|$) 127.0.0.1:18445;
        default 127.0.0.1:18443;
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_protocol on;
        proxy_connect_timeout 3s;
        proxy_timeout 600s;
        proxy_pass $relay_tls_backend;
    }

    server {
        listen 127.0.0.1:18445 proxy_protocol;
        proxy_connect_timeout 3s;
        proxy_timeout 20s;
        proxy_pass 127.0.0.1:18444;
    }
}
