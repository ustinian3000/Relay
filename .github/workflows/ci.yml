name: Relay CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build gateway
        run: go build -o bin/relay ./cmd/server
      - name: Antigravity OAuth configuration regression
        run: >-
          go test ./internal/auth/antigravity ./sdk/auth
          ./internal/api/handlers/management ./internal/runtime/executor
          -run 'Test(ClientCredentials|BuildAuthURL|.*Antigravity)'
      - name: Handoff and isolation regression
        run: >-
          go test -race ./internal/handoff ./internal/api
          ./sdk/cliproxy/auth ./internal/config
          -run 'Test(Handoff|Gateway|Explicit|ScopedPluginAffinity|AccountUsage)'
      - name: Hook tests
        run: python -m unittest discover -s client -p "test_*.py"
      - name: Web test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Local account manager tests
        run: python -m unittest discover -s web/account-manager -p "test_*.py"
      - name: Enrollment and Linux helper tests
        run: python -m unittest discover -s web/claude-login -p "test_*.py"
  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/key-account-bind
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: extensions/key-account-bind/go.sum
      - run: go test ./...
      - run: CGO_ENABLED=1 go build -buildmode=c-shared -o key-account-bind.so .
